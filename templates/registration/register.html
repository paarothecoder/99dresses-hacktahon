<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join 99dress | Infinite Closet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --accent: #7c3aed;
            --body: #f8fafc;
        }

        body { 
            background-color: var(--body); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: #0f172a;
        }

        /* 2026 Modern Inputs */
        input {
            width: 100%;
            background-color: #f1f5f9; /* slate-100 */
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 14px 18px;
            font-weight: 600;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            background-color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 10px 20px -10px rgba(124, 58, 237, 0.3);
        }

        /* Styling Django's help text and errors */
        .helptext {
            display: block;
            font-size: 10px;
            color: #94a3b8;
            margin-top: 6px;
            padding: 0 8px;
            line-height: 1.5;
        }

        .errorlist {
            color: #ef4444;
            font-size: 11px;
            font-weight: 700;
            list-style: none;
            padding: 0;
            margin: 6px 0 0 8px;
        }

        .btn-modern {
            background: #000;
            color: #fff;
            border-radius: 20px;
            font-weight: 700;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-modern:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="max-w-lg w-full">
        <div class="flex flex-col items-center mb-10">
            <div class="w-14 h-14 bg-black rounded-2xl flex items-center justify-center mb-4 shadow-2xl shadow-purple-200">
                <span class="text-white font-black text-2xl italic">9</span>
            </div>
            <h1 class="text-3xl font-black tracking-tighter">99dress</h1>
            <p class="text-slate-400 font-medium mt-1">Start your infinite closet</p>
        </div>

        <div class="bg-white p-8 md:p-10 rounded-[40px] shadow-2xl shadow-slate-200/50 border border-slate-50">
            <h2 class="text-xl font-extrabold mb-8 text-slate-800">Create Account</h2>
            
            <form method="post" class="space-y-5">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="flex flex-col">
                        <label for="{{ field.id_for_label }}" class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-2">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        
                        {% if field.help_text %}
                            <span class="helptext">{{ field.help_text|safe }}</span>
                        {% endif %}

                        {% if field.errors %}
                            {{ field.errors }}
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn-modern w-full py-5 mt-4 shadow-xl shadow-gray-200 hover:shadow-none transition-shadow">
                    Create Account
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-sm text-slate-500 font-medium">
                    Already part of the closet? 
                    <a href="{% url 'login' %}" class="text-purple-600 font-extrabold hover:underline ml-1">Log in</a>
                </p>
            </div>
        </div>

        <div class="mt-10 text-center">
            <p class="text-[9px] text-slate-300 font-bold uppercase tracking-[0.4em]">Designed for 2026</p>
        </div>
    </div>

</body>
</html>
